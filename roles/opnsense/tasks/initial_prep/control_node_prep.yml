---
#
##########################################
# SETUP CONTROL NODE PRE-REQUISITES HERE #
##########################################
#
####################################################
# UPDATE APT CACHE AND UPGRADE ALL SYSTEM PACKAGES #
####################################################
#
- name: REFRESH APT CACHE AND UPGRADE ALL SYSTEM PACKAGES
  ansible.builtin.apt:
    name: "*"
    state: latest
    update_cache: true
  register: response
- name: REFRESH APT CACHE AND UPGRADE ALL SYSTEM PACKAGES (LOG)
  ansible.builtin.debug:
    msg: "{{response}}"
#
##############################
# INSTALL LXML PYTHON MODULE #
##############################
#
- name: INSTALL PYTHON LXML MODULE
  ansible.builtin.apt:
    name: 
      - python3-lxml
    state: latest
  register: response
- name: INSTALL PYTHON LXML MODULE (LOG)
  ansible.builtin.debug:
    msg: "{{response}}"
#
...
